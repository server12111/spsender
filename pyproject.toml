[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-autosender"
version = "2.0.6"
description = "Личная Telegram-админка разрешённых публикаций"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.31,<3.32", "Telethon>=1.45,<1.46", "cryptography>=44", "python-dotenv>=1.0", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-socket>=0.7", "ruff>=0.11"]

[project.scripts]
fe-autosender = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/*.sql", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

